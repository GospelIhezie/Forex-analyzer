name: XAU/USD Gold Fundamentals Bot

on:
  schedule:
    # 08:00, 12:00, 16:00, 20:00 West Africa Time (UTC+1) = 07:00, 11:00,
    # 15:00, 19:00 UTC. GitHub Actions cron always runs in UTC.
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  run-gold-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gold analyser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m gold_fundamentals.main
